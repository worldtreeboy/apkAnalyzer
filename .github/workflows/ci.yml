name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.8"
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile and test
        run: |
          python -m py_compile apkAnalyzer.py build_release.py tests/test_apk_analyzer.py
          python -m unittest discover -s tests -v
      - name: Build and smoke-test release JAR
        run: |
          python build_release.py --output dist/apkAnalyzer.jar
          java -jar dist/apkAnalyzer.jar --help
