name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.8"
      - name: Verify tag, compile, and test
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from apk_analyzer.version import TOOL_VERSION; print(TOOL_VERSION)')"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match TOOL_VERSION ${version}" >&2
            exit 1
          fi
          python -m compileall -q apkAnalyzer.py apk_analyzer tests
          python apkAnalyzer.py --help
          python apkAnalyzer.py scan --help
          python -m unittest discover -s tests -v
          if command -v node >/dev/null 2>&1; then
            node --check frida_scripts/universal_bypass.js
          fi
      - name: Build source artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="apkAnalyzer-${GITHUB_REF_NAME}.zip"
          git archive \
            --format=zip \
            --prefix="apkAnalyzer-${GITHUB_REF_NAME}/" \
            --output="${archive}" \
            "${GITHUB_SHA}"
          sha256sum "${archive}" > "${archive}.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="apkAnalyzer-${GITHUB_REF_NAME}.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload \
              "${GITHUB_REF_NAME}" \
              "${archive}" \
              "${archive}.sha256" \
              --clobber
          else
            gh release create \
              "${GITHUB_REF_NAME}" \
              "${archive}" \
              "${archive}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "APK Analyzer ${GITHUB_REF_NAME}"
          fi
